
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080c16">
<title>Merry Christmas, Please Don't Call</title>

<style>
:root {
  --gold: #e7d3ae;
  --blue: #c8d9ed;
  --white: #f4f3f1;
  --muted: #c3c9d5;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  background: #05070c;
  color: var(--white);
  font-family: Georgia, "Times New Roman", serif;
}

body {
  min-height: 100dvh;
  display: grid;
  place-items: center;
  overflow: hidden;
}

button {
  font: inherit;
}

.player {
  position: relative;
  isolation: isolate;
  width: min(100vw, 480px);
  height: 100dvh;
  height: 100svh;
  max-height: 960px;
  aspect-ratio: 9 / 16;
  overflow: hidden;
  background: #101522;
  touch-action: manipulation;
}

/* Background cinematic */
.bg {
  position: absolute;
  z-index: -6;
  inset: -5%;
  background: url("violet.jpg") center / cover no-repeat;
  transform: scale(1.06);
  animation: cinematicZoom 24s ease-in-out infinite alternate;
  will-change: transform;
}

.tint {
  position: absolute;
  z-index: -5;
  inset: 0;
  background:
    linear-gradient(
      180deg,
      rgba(5, 9, 19, .35) 0%,
      rgba(8, 12, 22, .08) 35%,
      rgba(5, 8, 16, .42) 60%,
      rgba(4, 6, 13, .91) 100%
    ),
    linear-gradient(
      90deg,
      rgba(8, 15, 29, .25),
      transparent 65%
    );
}

.vignette {
  position: absolute;
  z-index: -4;
  inset: 0;
  box-shadow:
    inset 0 0 80px rgba(0, 0, 0, .35),
    inset 0 -100px 120px rgba(0, 0, 0, .25);
  pointer-events: none;
}

.color-grade {
  position: absolute;
  z-index: -3;
  inset: 0;
  background: rgba(90, 122, 165, .06);
  mix-blend-mode: screen;
  pointer-events: none;
}

#snow {
  position: absolute;
  z-index: -2;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

/* Film grain */
.grain {
  position: absolute;
  z-index: 5;
  inset: -50%;
  opacity: .055;
  pointer-events: none;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E");
  animation: grainDrift .5s steps(2) infinite;
}

/* Header */
.header {
  position: absolute;
  top: max(27px, env(safe-area-inset-top));
  left: 24px;
  right: 24px;
  z-index: 6;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  text-shadow: 0 2px 12px #000;
}

.kicker {
  color: var(--gold);
  font-family: Arial, sans-serif;
  font-size: 9px;
  letter-spacing: 4px;
  text-transform: uppercase;
  opacity: .9;
}

.song-title {
  margin-top: 9px;
  color: rgba(255, 255, 255, .9);
  font-family: Arial, sans-serif;
  font-size: 11px;
  letter-spacing: .5px;
}

.chapter {
  color: rgba(255, 255, 255, .62);
  font-family: Arial, sans-serif;
  font-size: 9px;
  letter-spacing: 2px;
}

/* Lyrics */
.lyric-zone {
  position: absolute;
  z-index: 4;
  top: 49%;
  left: 0;
  width: 100%;
  padding: 25px 25px;
  text-align: center;
  transform: translateY(-50%);
  pointer-events: none;
}

.symbol {
  margin-bottom: 27px;
  color: var(--gold);
  font-size: 13px;
  letter-spacing: 10px;
  opacity: .8;
  animation: symbolGlow 5s ease-in-out infinite alternate;
}

.lyric {
  display: block;
  width: 100%;
  color: var(--white);
  font-size: clamp(28px, 7.5vw, 39px);
  font-weight: normal;
  line-height: 1.3;
  letter-spacing: -.7px;
  text-wrap: balance;
  text-shadow: 0 3px 20px rgba(0, 0, 0, .75);
  opacity: 0;
  filter: blur(8px);
  transform: translateY(12px);
  transition:
    opacity 1.05s ease,
    filter 1.05s ease,
    transform 1.3s cubic-bezier(.2, .65, .3, 1);
}

.lyric.visible {
  opacity: 1;
  filter: blur(0);
  transform: translateY(0);
}

.lyric.gold {
  color: var(--gold);
}

.lyric.blue {
  color: var(--blue);
}

.lyric.pink {
  color: #e8d5dc;
}

.subline {
  width: 28px;
  height: 1px;
  margin: 25px auto 15px;
  background: var(--gold);
  opacity: .75;
  transition: width 1.2s ease, opacity 1.2s ease;
}

.caption {
  color: rgba(255, 255, 255, .67);
  font-family: Arial, sans-serif;
  font-size: 8px;
  letter-spacing: 3px;
  line-height: 1.8;
  opacity: 0;
  transition: opacity 1.2s ease;
}

.caption.visible {
  opacity: 1;
}

/* Subtle cinematic transitions */
.scene-fade {
  position: absolute;
  z-index: 7;
  inset: 0;
  background: #05070c;
  opacity: 1;
  pointer-events: none;
  animation: openingFade 3.2s ease forwards;
}

.player.ending .bg {
  animation: endingZoom 7s ease forwards;
}

.player.ending .tint {
  background:
    linear-gradient(
      180deg,
      rgba(5, 8, 17, .45),
      rgba(5, 7, 14, .94)
    );
  transition: background 4s ease;
}

.player.ending .lyric-zone {
  top: 50%;
}

.player.ended .scene-fade {
  animation: endingFade 3s ease forwards;
}

/* Player controls */
.footer {
  position: absolute;
  z-index: 9;
  bottom: max(25px, env(safe-area-inset-bottom));
  left: 24px;
  right: 24px;
}

.progress {
  width: 100%;
  height: 2px;
  margin-bottom: 17px;
  background: rgba(255, 255, 255, .3);
  cursor: pointer;
  touch-action: manipulation;
}

.progress-fill {
  width: 0%;
  height: 100%;
  background: var(--gold);
  box-shadow: 0 0 8px rgba(231, 211, 174, .3);
}

.controls {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.time {
  color: rgba(255, 255, 255, .7);
  font-family: Arial, sans-serif;
  font-size: 10px;
  font-variant-numeric: tabular-nums;
}

.play {
  display: grid;
  width: 44px;
  height: 44px;
  place-items: center;
  border: 1px solid rgba(231, 211, 174, .6);
  border-radius: 50%;
  background: rgba(10, 15, 25, .45);
  color: var(--gold);
  font-family: Arial, sans-serif;
  font-size: 14px;
  backdrop-filter: blur(8px);
  cursor: pointer;
  transition: background .3s ease, transform .3s ease;
}

.play:active {
  transform: scale(.94);
}

.hint {
  margin-top: 13px;
  color: rgba(255, 255, 255, .43);
  font-family: Arial, sans-serif;
  font-size: 8px;
  letter-spacing: 3px;
  text-align: center;
}

/* Animations */
@keyframes cinematicZoom {
  0% {
    transform: scale(1.06) translate(0, 0);
  }
  100% {
    transform: scale(1.17) translate(-.6%, .5%);
  }
}

@keyframes symbolGlow {
  from { opacity: .55; }
  to { opacity: .95; }
}

@keyframes grainDrift {
  0% { transform: translate(0, 0); }
  100% { transform: translate(1%, -1%); }
}

@keyframes openingFade {
  0% { opacity: 1; }
  100% { opacity: 0; visibility: hidden; }
}

@keyframes endingZoom {
  from { transform: scale(1.17) translate(-.6%, .5%); }
  to { transform: scale(1.04) translate(0, 0); }
}

@keyframes endingFade {
  0% { opacity: 0; }
  100% { opacity: 1; }
}

@media (min-width: 600px) {
  .player {
    height: min(92dvh, 850px);
    border: 1px solid rgba(255, 255, 255, .08);
    box-shadow: 0 20px 100px #000b;
  }
}

@media (prefers-reduced-motion: reduce) {
  .bg,
  .grain,
  .symbol {
    animation: none;
  }

  .lyric,
  .caption {
    transition-duration: .3s;
  }
}
</style>
</head>

<body>
<main class="player" id="player">
  <div class="bg"></div>
  <div class="tint"></div>
  <div class="vignette"></div>
  <div class="color-grade"></div>
  <canvas id="snow"></canvas>
  <div class="grain"></div>

  <header class="header">
    <div>
      <div class="kicker">A winter memory</div>
      <div class="song-title">Merry Christmas, Please Don't Call</div>
    </div>
    <div class="chapter">NO. 025</div>
  </header>

  <section class="lyric-zone" aria-live="polite">
    <div class="symbol">✧ ❄ ✧</div>
    <div class="lyric gold visible" id="lyric">Some memories never leave.</div>
    <div class="subline" id="subline"></div>
    <div class="caption visible" id="caption">MEMORIES DON'T FADE</div>
  </section>

  <footer class="footer">
    <div class="progress" id="progress" aria-label="Seek through song">
      <div class="progress-fill" id="fill"></div>
    </div>

    <div class="controls">
      <span class="time" id="current">00:00</span>
      <button class="play" id="play" aria-label="Play">▶</button>
      <span class="time" id="total">--:--</span>
    </div>

    <div class="hint">LISTEN WITH YOUR HEART</div>
  </footer>

  <div class="scene-fade" id="sceneFade"></div>

  <audio id="audio" preload="metadata">
    <source src="song.mp3" type="audio/mpeg">
  </audio>
</main>

<script>
const $ = id => document.getElementById(id);

const player = $("player");
const audio = $("audio");
const lyricEl = $("lyric");
const caption = $("caption");
const playBtn = $("play");
const fill = $("fill");
const sceneFade = $("sceneFade");
const subline = $("subline");

const FADE_IN_SECONDS = 5;
const FADE_OUT_SECONDS = 4;

const lyrics = [
  { t: 0.73, text: "One ticket out of your heavy gaze", c: "white" },
  { t: 4.58, text: "I want one ticket off of your carousel", c: "blue" },
  { t: 8.59, text: "I want one ticket out of your heavy gaze", c: "white" },
  { t: 12.76, text: "I want one ticket off of your carousel", c: "blue" },
  { t: 18.26, text: "But you should know that I died slow", c: "gold" },
  { t: 22.87, text: "Running through the halls of your haunted home", c: "white" },
  { t: 27.03, text: "And the toughest part is that we both know", c: "blue" },
  { t: 30.96, text: "What happened to you", c: "pink" },
  { t: 32.93, text: "Why you're out on your own", c: "white" },
  { t: 35.89, text: "Merry Christmas", c: "gold" },
  { t: 37.85, text: "Please don't call", c: "white" },
  { t: 40.33, text: "Merry Christmas", c: "gold" },
  { t: 41.73, text: "I'm not yours at all", c: "pink" },
  { t: 44.35, text: "Merry Christmas", c: "gold" },
  { t: 46.35, text: "Please don't call me", c: "white" },
  { t: 50.64, text: "Please don't call me", c: "gold" },
  { t: 54.89, text: "Please don't call me", c: "white" },
  { t: 59.19, text: "Please don't call me", c: "gold" }
];

let currentIndex = -2;
let fadeFrame = null;
let fadeOutStarted = false;
let lastVolume = 1;

function clock(seconds) {
  if (!Number.isFinite(seconds)) return "00:00";

  const safeSeconds = Math.max(0, Math.floor(seconds));

  return String(Math.floor(safeSeconds / 60)).padStart(2, "0") +
    ":" +
    String(safeSeconds % 60).padStart(2, "0");
}

function getLyricIndex(time) {
  let index = -1;

  for (let i = 0; i < lyrics.length; i++) {
    if (time >= lyrics[i].t) {
      index = i;
    } else {
      break;
    }
  }

  return index;
}

function setLyric(index) {
  if (index === currentIndex) return;
  currentIndex = index;

  lyricEl.classList.remove("visible");
  caption.classList.remove("visible");

  if (index < 0) {
    lyricEl.textContent = "Some memories never leave.";
    lyricEl.className = "lyric gold";
    caption.textContent = "MEMORIES DON'T FADE";
    player.classList.remove("ending");
    subline.style.width = "28px";

    requestAnimationFrame(() => {
      lyricEl.classList.add("visible");
      caption.classList.add("visible");
    });

    return;
  }

  const item = lyrics[index];

  lyricEl.textContent = item.text;
  lyricEl.className = "lyric " + item.c;

  if (index >= 14) {
    caption.textContent = "PLEASE DON'T CALL";
  } else if (index >= 9) {
    caption.textContent = "A CHRISTMAS WITHOUT YOU";
  } else {
    caption.textContent = "A WINTER MEMORY";
  }

  player.classList.toggle("ending", index >= 14);

  subline.style.width = index >= 14 ? "18px" : "28px";

  requestAnimationFrame(() => {
    lyricEl.classList.add("visible");
    caption.classList.add("visible");
  });
}

function cancelVolumeFade() {
  if (fadeFrame !== null) {
    cancelAnimationFrame(fadeFrame);
    fadeFrame = null;
  }
}

function fadeVolume(from, to, duration, onComplete) {
  cancelVolumeFade();

  const start = performance.now();

  function step(now) {
    if (audio.paused && to > from) {
      fadeFrame = null;
      return;
    }

    const progress = Math.min((now - start) / (duration * 1000), 1);

    // Smoothstep membuat perubahan volume lebih natural.
    const eased = progress * progress * (3 - 2 * progress);

    audio.volume = Math.max(
      0,
      Math.min(1, from + (to - from) * eased)
    );

    if (progress < 1) {
      fadeFrame = requestAnimationFrame(step);
    } else {
      audio.volume = to;
      fadeFrame = null;

      if (onComplete) onComplete();
    }
  }

  fadeFrame = requestAnimationFrame(step);
}

async function startPlayback() {
  try {
    cancelVolumeFade();
    fadeOutStarted = false;
    player.classList.remove("ended");

    audio.volume = 0;
    await audio.play();

    fadeVolume(0, lastVolume, FADE_IN_SECONDS);
  } catch (error) {
    cancelVolumeFade();
    audio.volume = lastVolume;

    alert(
      "Audio belum bisa diputar. Pastikan file song.mp3 tersedia dan namanya benar."
    );
  }
}

playBtn.addEventListener("click", () => {
  if (audio.paused) {
    startPlayback();
  } else {
    cancelVolumeFade();
    audio.pause();
  }
});

audio.addEventListener("play", () => {
  playBtn.textContent = "Ⅱ";
  player.classList.remove("paused");
});

audio.addEventListener("pause", () => {
  playBtn.textContent = "▶";
  player.classList.add("paused");
  cancelVolumeFade();
});

audio.addEventListener("loadedmetadata", () => {
  $("total").textContent = clock(audio.duration);
});

function updatePlayer() {
  const time = audio.currentTime;

  setLyric(getLyricIndex(time));

  $("current").textContent = clock(time);

  if (Number.isFinite(audio.duration) && audio.duration > 0) {
    fill.style.width =
      Math.min(100, time / audio.duration * 100) + "%";

    // Fade-out otomatis menjelang akhir lagu.
    const remaining = audio.duration - time;

    if (
      remaining <= FADE_OUT_SECONDS &&
      remaining > 0 &&
      !fadeOutStarted &&
      !audio.paused
    ) {
      fadeOutStarted = true;

      const from = audio.volume;

      fadeVolume(from, 0, remaining, () => {
        if (!audio.paused) {
          audio.pause();
          player.classList.add("ended");
        }
      });
    }
  }
}

audio.addEventListener("timeupdate", updatePlayer);
audio.addEventListener("seeked", () => {
  // Kalau pengguna seek mundur, izinkan fade-out berjalan lagi nanti.
  fadeOutStarted = false;
  updatePlayer();
});

audio.addEventListener("ended", () => {
  cancelVolumeFade();

  audio.volume = lastVolume;
  fadeOutStarted = false;

  player.classList.add("ended");
  player.classList.remove("ending");

  fill.style.width = "0%";
  $("current").textContent = "00:00";

  currentIndex = -2;
  setLyric(-1);
});

$("progress").addEventListener("click", event => {
  if (!Number.isFinite(audio.duration) || audio.duration <= 0) return;

  const rect = event.currentTarget.getBoundingClientRect();

  const ratio = Math.max(
    0,
    Math.min(1, (event.clientX - rect.left) / rect.width)
  );

  audio.currentTime = ratio * audio.duration;
});

/* Snow particles */
const canvas = $("snow");
const ctx = canvas.getContext("2d");

let snowflakes = [];
let canvasWidth = 0;
let canvasHeight = 0;

function resizeCanvas() {
  const rect = player.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  canvasWidth = rect.width;
  canvasHeight = rect.height;

  canvas.width = Math.round(canvasWidth * dpr);
  canvas.height = Math.round(canvasHeight * dpr);

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  snowflakes = Array.from({ length: 48 }, () => ({
    x: Math.random() * canvasWidth,
    y: Math.random() * canvasHeight,
    radius: Math.random() * 1.2 + .35,
    speed: Math.random() * .35 + .12,
    drift: (Math.random() - .5) * .22,
    opacity: Math.random() * .35 + .12
  }));
}

function drawSnow() {
  ctx.clearRect(0, 0, canvasWidth, canvasHeight);

  for (const flake of snowflakes) {
    flake.y += flake.speed;
    flake.x += flake.drift;

    if (flake.y > canvasHeight + 3) {
      flake.y = -3;
      flake.x = Math.random() * canvasWidth;
    }

    if (flake.x < -3) flake.x = canvasWidth + 3;
    if (flake.x > canvasWidth + 3) flake.x = -3;

    ctx.beginPath();
    ctx.arc(
      flake.x,
      flake.y,
      flake.radius,
      0,
      Math.PI * 2
    );

    ctx.fillStyle =
      `rgba(225, 235, 250, ${flake.opacity})`;

    ctx.fill();
  }

  requestAnimationFrame(drawSnow);
}

resizeCanvas();
drawSnow();
window.addEventListener("resize", resizeCanvas);

// Fade-in pembuka visual.
window.addEventListener("load", () => {
  sceneFade.style.animation = "openingFade 3.2s ease forwards";
});
</script>
</body>
</html>
